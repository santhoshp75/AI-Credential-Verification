<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Certificate Verification</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.10);
        }

        h1 {
            text-align: center;
            color: #1d3557;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .upload-box {
            border: 2px dashed #457b9d;
            border-radius: 14px;
            padding: 30px 20px;
            text-align: center;
            background: #f8fbff;
            margin-bottom: 20px;
        }

        .upload-box label {
            display: block;
            font-weight: bold;
            color: #1d3557;
            margin-bottom: 15px;
        }

        input[type="file"] {
            width: 100%;
            padding: 10px;
        }

        .btn {
            width: 100%;
            border: none;
            padding: 14px;
            border-radius: 10px;
            background: #1d3557;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn:hover {
            background: #16324f;
        }

        .info {
            margin-top: 20px;
            padding: 15px;
            background: #eef6ff;
            border-radius: 10px;
            color: #444;
            font-size: 13px;
            line-height: 1.6;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #1d3557;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Certificate Verification</h1>

    <p class="subtitle">
        Upload a certificate to verify its authenticity
    </p>

    <form action="{{ url_for('ai_verify') }}"
          method="POST"
          enctype="multipart/form-data">

        <div class="upload-box">

            <label for="certificate">
                Select Certificate
            </label>

            <input
                type="file"
                id="certificate"
                name="certificate"
                accept=".pdf,.png,.jpg,.jpeg"
                required
            >

        </div>

        <button type="submit" class="btn">
            Verify Certificate
        </button>

    </form>

    <div class="info">
        <strong>Supported files:</strong>
        PDF, PNG, JPG and JPEG
        <br><br>

        The uploaded certificate will be checked
        against the registered certificate records.
    </div>

    <a href="{{ url_for('home') }}" class="back">
        ← Back to Home
    </a>

</div>

</body>
</html>
